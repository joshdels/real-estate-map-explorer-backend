[project]
name = "real-estate-map-backend"
version = "0.1.0"
description = "Django REST API for Open Lot Plans"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dj-database-url>=3.0,<4.0",
    "dj-rest-auth[with-social]>=7.2,<8.0",
    "django>=5.2,<6.0",
    "django-cors-headers>=4.9,<5.0",
    "djangorestframework>=3.16,<4.0",
    "djangorestframework-simplejwt>=5.5,<6.0",
    "drf-spectacular>=0.29,<1.0",
    "psycopg[binary]>=3.2,<4.0",
]

[dependency-groups]
dev = [
    "ruff>=0.14,<1.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"**/migrations/*.py" = ["E501", "I001"]
